services:
  mihomo-config:
    build: .
    user: "0:0"
    command: ["node", "ops/mihomo/render-config.mjs"]
    restart: "no"
    env_file: .env
    environment:
      MIHOMO_CONFIG_PATH: /mihomo/config.yaml
    volumes:
      - mihomo-data:/mihomo
    networks: [internal]

  mihomo:
    image: metacubex/mihomo:v1.19.31
    restart: unless-stopped
    command: ["-d", "/root/.config/mihomo", "-f", "/root/.config/mihomo/config.yaml"]
    volumes:
      - mihomo-data:/root/.config/mihomo
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      mihomo-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/mihomo", "-t", "-d", "/root/.config/mihomo", "-f", "/root/.config/mihomo/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [internal]

  metacubexd:
    image: ghcr.io/metacubex/metacubexd:v1.270.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:80"
    depends_on:
      mihomo:
        condition: service_healthy
    networks: [internal]

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: workbuddy
      POSTGRES_USER: workbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbuddy -d workbuddy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://workbuddy:${POSTGRES_PASSWORD}@postgres:5432/workbuddy
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  worker:
    build: .
    command: ["node", "src/platform/worker.mjs"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://workbuddy:${POSTGRES_PASSWORD}@postgres:5432/workbuddy
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  legacy-gateway:
    build: .
    command: ["node", "src/gateway/index.mjs"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - tasks-data:/app/data
    networks: [internal]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  mihomo-data:
  postgres-data:
  postgres-backups:
  tasks-data:
  caddy-data:
  caddy-config:
networks:
  internal:
