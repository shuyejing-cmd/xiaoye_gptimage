services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: workbuddy
      POSTGRES_USER: workbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbuddy -d workbuddy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://workbuddy:${POSTGRES_PASSWORD}@postgres:5432/workbuddy
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  worker:
    build: .
    command: ["node", "src/platform/worker.mjs"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://workbuddy:${POSTGRES_PASSWORD}@postgres:5432/workbuddy
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  legacy-gateway:
    build: .
    command: ["node", "src/gateway/index.mjs"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - tasks-data:/app/data
    networks: [internal]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres-data:
  postgres-backups:
  tasks-data:
  caddy-data:
  caddy-config:
networks:
  internal:
